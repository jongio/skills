name: Skill Lint

on:
  pull_request:
    # Anchored so the push trigger below reuses one list. Actions supports YAML
    # anchors and aliases; only merge keys (`<<:`) remain unsupported.
    paths: &skill_lint_paths
      - "skills/**/SKILL.md"
      - "skills/**/package.json"
      - "skills/**/test/**"
      - "skills/**/*.yaml"
      - "skills/**/eval.yaml"
      - "site/src/content/skills/**"
      - "site/public/images/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "README.md"
      - "marketplace.json"
      - "plugin.json"
      # Without this, edits to this workflow never lint themselves, so a
      # change here can only be verified by a manual workflow_dispatch.
      - ".github/workflows/skill-lint.yml"
  push:
    branches: [main]
    paths: *skill_lint_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24, not 22. Vally declares `npm>=11.11.1`, and Node 22 still
      # bundles npm 10.x, which makes every install log an EBADENGINE warning.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # Pinned to the same range the skills' package.json files declare. This
      # job lints every skill, including ones with no package.json of their own,
      # so it cannot use a local install the way skill-eval.yml does. Keep this
      # version in step with skills/*/package.json when bumping vally.
      - name: Install Vally CLI
        run: npm install -g "@microsoft/vally-cli@0.14.0"

      - name: Determine skills to lint
        id: skills
        env:
          # Routed through env for the same reason the steps below do it: no
          # workflow context value is interpolated straight into a shell script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Lint only skills with changes in this PR
            DIRS=$(git diff --name-only "$BASE_SHA" HEAD \
              -- 'skills/*/SKILL.md' 'skills/*/package.json' 'skills/*/*.yaml' \
                 'skills/*/evals/**' 'skills/*/test/**' \
              | sed 's|^\(skills/[^/]*\)/.*|\1|' | sort -u)
          else
            # Push to main or manual dispatch: lint all skills
            DIRS=$(find skills -maxdepth 2 -name "SKILL.md" -printf '%h\n' | sort -u)
          fi
          if [ -z "$DIRS" ]; then
            echo "dirs=" >> "$GITHUB_OUTPUT"
            echo "No skill directories to lint"
          else
            echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$DIRS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Will lint: $DIRS"
          fi

      - name: Lint skills (spec-compliance)
        if: steps.skills.outputs.dirs != ''
        env:
          SKILL_DIRS: ${{ steps.skills.outputs.dirs }}
        run: |
          FAILED=0
          while IFS= read -r dir; do
            echo "::group::Linting $dir"
            if ! vally lint "$dir"; then
              FAILED=1
            fi
            echo "::endgroup::"
          done <<< "$SKILL_DIRS"
          exit $FAILED

      - name: Validate eval specs
        if: steps.skills.outputs.dirs != ''
        env:
          SKILL_DIRS: ${{ steps.skills.outputs.dirs }}
        run: |
          while IFS= read -r dir; do
            for spec in $(find "$dir" -name "eval.yaml" -path "*/evals/*" 2>/dev/null); do
              echo "Validating $spec"
              vally lint --eval-spec "$spec" --strict
            done
          done <<< "$SKILL_DIRS"

      - name: Run deterministic skill tests
        if: steps.skills.outputs.dirs != ''
        env:
          SKILL_DIRS: ${{ steps.skills.outputs.dirs }}
        run: |
          while IFS= read -r dir; do
            if [ -f "$dir/package.json" ] && npm pkg get scripts.test --prefix "$dir" | grep -qv '{}'; then
              npm test --prefix "$dir"
            fi
          done <<< "$SKILL_DIRS"

      # Deliberately ungated. The catalog is a registration surface for every
      # skill, so a SKILL.md or marketplace edit can break the site even when
      # nothing under site/ changed. Building on every run is the cheapest way
      # to keep catalog integrity a hard gate rather than a nightly surprise.
      - name: Build catalog site
        run: |
          npm ci --prefix site
          npm run build --prefix site

  # The dns-doctor cache engine resolves platform cache paths and refuses
  # redirected paths, and both behave differently per operating system. macOS
  # in particular puts os.tmpdir() under /var, which is itself a link to
  # /private/var, so a guard that compares a path to its own resolved form
  # fails there and nowhere else. That regression is only observable on this
  # matrix, so the suite runs on all three.
  dns-doctor-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skills/dns-doctor/package-lock.json
      - name: Install dependencies
        working-directory: skills/dns-doctor
        run: npm ci --ignore-scripts
      - name: Run tests and enforce coverage
        working-directory: skills/dns-doctor
        run: npm run test:coverage
