name: Skill Eval

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to evaluate, by id or path (e.g. create-canvas-app). Leave empty to run every skill."
        required: false
        type: string
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

# copilot-requests lets the built-in GITHUB_TOKEN authenticate the Copilot
# SDK that vally drives, so no PAT secret is needed. In a personally-owned
# repo the usage bills to the repo owner's Copilot seat.
permissions:
  contents: read

concurrency:
  # Keep total Copilot usage bounded across manual and scheduled runs.
  group: skill-eval
  cancel-in-progress: false

jobs:
  # Discover eval specifications from the trusted checked-out revision. Pull
  # request eval remains disabled, so untrusted changes cannot reach Copilot.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select skills to evaluate
        id: select
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/skill-eval-matrix.jsonl"
          : > "$matrix_file"
          while IFS= read -r spec; do
            skill_dir=${spec%%/evals/*}
            skill_id=${skill_dir#skills/}
            expected="$skill_dir/evals/$skill_id/eval.yaml"
            if [[ ! "$skill_id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] ||
               [ "$spec" != "$expected" ] ||
               [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "::error::Refusing non-canonical eval specification path."
              exit 1
            fi
            eval_spec=${spec#"$skill_dir/"}
            jq -cn \
              --arg skill "$skill_dir" \
              --arg skill_id "$skill_id" \
              --arg eval_spec "$eval_spec" \
              '{skill:$skill, skill_id:$skill_id, eval_spec:$eval_spec}' \
              >> "$matrix_file"
          done < <(
            find skills -mindepth 4 -maxdepth 4 -type f \
              -path 'skills/*/evals/*/eval.yaml' -print | LC_ALL=C sort
          )
          all=$(jq -sc '.' "$matrix_file")
          if [ "$(jq 'length' <<<"$all")" -eq 0 ]; then
            echo "::error::No canonical skill eval specifications were found."
            exit 1
          fi
          if [ -z "${SKILL:-}" ]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg s "$SKILL" '[.[] | select(.skill_id == $s or .skill == $s)]' <<<"$all")
            if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
              echo "::error::Requested skill was not discovered."
              exit 1
            fi
          fi
          count=$(jq 'length' <<<"$selected")
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No skill evals to run for this change."
          else
            echo "Evaluating: $(jq -r '[.[].skill_id] | join(", ")' <<<"$selected")"
          fi

  eval:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      # One skill's eval failing must not cancel the other skills' evals.
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/tools/vally/package-lock.json

      - name: Install Vally CLI
        run: npm ci --prefix .github/tools/vally --ignore-scripts

      - name: Install validation dependencies
        if: matrix.skill_id == 'dns-doctor' || matrix.skill_id == 'repo-ready'
        working-directory: ${{ matrix.skill }}
        run: npm ci --ignore-scripts

      - name: Validate skill
        if: matrix.skill_id == 'dns-doctor' || matrix.skill_id == 'repo-ready'
        working-directory: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          npm run test --if-present
          npm run test:coverage --if-present
          npm run eval:lint --if-present

      - name: Report Vally version
        env:
          VALLY_BIN: ${{ github.workspace }}/.github/tools/vally/node_modules/.bin/vally
        run: "$VALLY_BIN" --version

      # This step contains one command so the token is available only to the
      # exact Vally eval process.
      - name: Run eval
        working-directory: ${{ matrix.skill }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_SPEC: ${{ matrix.eval_spec }}
          VALLY_BIN: ${{ github.workspace }}/.github/tools/vally/node_modules/.bin/vally
        run: |
          "$VALLY_BIN" eval \
            --eval-spec "$EVAL_SPEC" \
            --skill-dir . \
            --output-dir ./vally-results \
            --runs 5 \
            --workers 2 \
            --max-retries 0

      - name: Assert eval passed
        working-directory: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          summary=$(find vally-results -name results.jsonl -type f -print -quit)
          test -n "$summary"
          # This gate is deliberately STRICTER than vally's own verdict, in two
          # different ways, and the difference matters when authoring stimuli.
          #
          # Prompt graders are forgiven: vally averages their scores into
          # `overallScore`, so a stimulus that scores 4/5 still contributes and
          # the eval can pass on the mean.
          #
          # skill-invocation, diff-empty, and tool-calls are NOT forgiven. Every
          # trial of every stimulus must pass all three.
          #
          # The practical consequence: a stimulus whose correct answer can be
          # produced WITHOUT opening the skill (a flat refusal, or a question
          # back to the user) will intermittently fail skill-invocation and make
          # this job look randomly broken. Write every stimulus so a correct
          # answer requires skill-specific knowledge.
          jq -s -e '
            ([.[] | select(.type == "trial-result")] | group_by(.stimulus)) as $stimuli |
            ([.[] | select(.type == "run-summary")] | last) as $run |
            ($run.passed == true) and
            ($run.hadExecutionErrors == false) and
            ($run.evals | length > 0) and
            ($run.evals | all(
              (.passed == true) and
              (.scoringApplied == true) and
              (.overallScore >= .threshold)
            )) and
            ($stimuli | length > 0) and
            ($stimuli | all(
              all(.[].gradeResult.details[];
                if (.name | test("^(skill-invocation|diff-empty|tool-calls)"))
                then .passed == true
                else true
                end
              )
            ))
          ' "$summary" > /dev/null
