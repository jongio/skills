name: Skill Eval

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to evaluate, by id or path (e.g. create-canvas-app). Leave empty to run every skill."
        required: false
        type: string
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

# copilot-requests lets the built-in GITHUB_TOKEN authenticate the Copilot
# SDK that vally drives, so no PAT secret is needed. In a personally-owned
# repo the usage bills to the repo owner's Copilot seat.
permissions:
  contents: read
  copilot-requests: write

jobs:
  # Resolves the workflow_dispatch `skill` input into the job matrix. The skill
  # list lives here only, so adding a skill means editing one place.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select skills to evaluate
        id: select
        env:
          # Passed via env, never interpolated into the script, so a crafted
          # dispatch input cannot inject shell.
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          all='[
            {"skill":"skills/create-gh-pages-site","skill_id":"create-gh-pages-site","eval_spec":"evals/create-gh-pages-site/eval.yaml"},
            {"skill":"skills/create-canvas-app","skill_id":"create-canvas-app","eval_spec":"evals/create-canvas-app/eval.yaml"},
            {"skill":"skills/naming-is-hard","skill_id":"naming-is-hard","eval_spec":"evals/naming-is-hard/eval.yaml"},
            {"skill":"skills/eli5","skill_id":"eli5","eval_spec":"evals/eli5/eval.yaml"}
          ]'
          if [ -z "${SKILL:-}" ]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg s "$SKILL" '[.[] | select(.skill_id == $s or .skill == $s)]' <<<"$all")
            if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
              echo "::error::No skill matches '$SKILL'. Valid ids: $(jq -r '[.[].skill_id] | join(", ")' <<<"$all")"
              exit 1
            fi
          fi
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "Evaluating: $(jq -r '[.[].skill_id] | join(", ")' <<<"$selected")"

  eval:
    needs: plan
    runs-on: ubuntu-latest
    # Each matrix job drives a real agent through the Copilot SDK, so an
    # unbounded hang would burn Actions minutes and Copilot usage up to the
    # six hour default. Cap it well above a normal full-suite run.
    timeout-minutes: 45
    strategy:
      # One skill's eval failing must not cancel the other skills' evals.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Node 24, not 22. Vally declares `npm>=11.11.1`, and Node 22 still
      # bundles npm 10.x, which makes every install log an EBADENGINE warning.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "${{ matrix.skill }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.skill }}
        run: npm ci

      # Deliberately NOT a global `npm install -g @microsoft/vally-cli`. The
      # step above already installs the skill's own devDependencies, so running
      # the local binary keeps CI on exactly the version the skill's
      # package.json declares. A global install floats to whatever is newest and
      # silently diverges from what `npm run eval` uses locally, which is how CI
      # ended up on 0.11.0 while package.json still pinned ^0.10.0.
      - name: Run eval
        working-directory: ${{ matrix.skill }}
        run: |
          ./node_modules/.bin/vally eval \
            --eval-spec ${{ matrix.eval_spec }} \
            --skill-dir . \
            --output-dir ./vally-results
        env:
          # Copilot resolves COPILOT_GITHUB_TOKEN ahead of GITHUB_TOKEN, so set
          # both to the Actions token and let the SDK pick up either one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ matrix.skill_id }}
          path: ${{ matrix.skill }}/vally-results/
