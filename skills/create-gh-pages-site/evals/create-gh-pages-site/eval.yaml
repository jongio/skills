name: create-gh-pages-site
description: >-
  Capability eval for the create-gh-pages-site skill. The agent must scaffold a
  working GitHub Pages site with the correct base path injected, the official
  deploy workflow added, and content that reflects the target repo rather than
  generic template demo text. Deterministic graders inspect produced files; an
  LLM rubric judges content quality and template adherence.
type: capability

defaults:
  runs: 1
  timeout: 10m
  executor: copilot-sdk

scoring:
  weights:
    file-exists: 0.15
    file-contains: 0.25
    file-not-contains: 0.10
    prompt: 0.50
  threshold: 0.8

# Grader `path` globs use the shape
# `{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}<file>` instead of a
# plain `**/<file>`. `**` descends into `node_modules`, so a vendored dependency
# that ships a same-named file can satisfy a grader on its own and turn a real
# failure into a false pass. That is not hypothetical: `**/.github/workflows/*.yml`
# matched `hello-cli/node_modules/@ungap/structured-clone/.github/workflows/node.js.yml`
# in CI. It passed only because the real deploy workflow happened to match too.
#
# The grader config accepts only `path` and `negate` (vally's globFiles() calls
# picomatch(pattern) with no options and there is no `ignore` option), so the
# exclusion has to live inside the pattern. `!(node_modules)` guards each leading
# segment. A `**/!(node_modules)/**/` shape does NOT work, because the leading
# `**` absorbs `node_modules` before the guard is ever reached.
#
# Note that `.github` is spelled literally rather than reached through `**`:
# picomatch defaults to `dot: false` and will not descend into a dot-directory.
#
# Verified with picomatch against the layouts the agent produces (site scaffolded
# into a subfolder and into the repo root) plus node_modules negative controls.
# Do not "simplify" these back to `**/`.

stimuli:
  - name: astro-site-for-cli-tool
    prompt: >-
      Use the create-gh-pages-site skill to scaffold an Astro GitHub Pages site
      for the repo "octocat/hello-cli". The repo is a CLI tool. Use the astro
      template. Make sure the base path, deploy workflow, and site content are
      correct for that repo. The current working directory contains the target
      repo fixture; scaffold the site into that directory, not elsewhere.
    tags:
      template: astro
      cost: high
    rubric:
      - The generated content names hello-cli and accurately describes it as a CLI tool.
      - The site content is specific to the target repository rather than template placeholder text.
    environment:
      files:
        - src: fixtures/astro-cli/README.md
          dest: README.md
        - src: fixtures/astro-cli/package.json
          dest: package.json
    graders:
      - type: file-exists
        name: deploy-workflow-created
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
      - type: file-exists
        name: astro-config-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
      - type: file-exists
        name: index-page-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}src/pages/index.astro"
      - type: file-contains
        name: base-path-injected
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
          value: "/hello-cli/"
      - type: file-contains
        name: workflow-uses-deploy-pages
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
          value: "actions/deploy-pages"
      - type: file-not-contains
        name: no-leftover-sentinels
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
          value: "__BASE_PATH__"
      - type: file-not-contains
        name: no-generic-site-name
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}src/pages/index.astro"
          value: "__SITE_NAME__"
      - type: prompt
        name: content-reflects-repo
        config:
          prompt: >-
            Review the generated site. Does the content mention "hello-cli" and
            describe it as a CLI tool? Is the content specific to the repo rather
            than generic template placeholder text? Score 1.0 if yes, 0.5 if
            partially, 0.0 if the site still shows default demo content.

  - name: static-html-for-library
    prompt: >-
      Use the create-gh-pages-site skill to scaffold a static HTML GitHub Pages
      site for the repo "octocat/math-utils". The repo is a JavaScript math
      utility library. Use the static-html template. The current working directory
      contains the target repo fixture; scaffold the site into that directory, not
      elsewhere.
    tags:
      template: static-html
      cost: high
    rubric:
      - The generated content names math-utils and describes its add, multiply, and clamp functions.
      - The site contains repository-specific content rather than generic template text.
    environment:
      files:
        - src: fixtures/static-library/README.md
          dest: README.md
        - src: fixtures/static-library/package.json
          dest: package.json
    graders:
      - type: file-exists
        name: deploy-workflow-created
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
      - type: file-exists
        name: index-html-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}index.html"
      - type: file-contains
        name: workflow-uses-deploy-pages
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
          value: "actions/deploy-pages"
      - type: file-not-contains
        name: no-leftover-sentinels
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}index.html"
          value: "__SITE_NAME__"
      - type: prompt
        name: content-reflects-repo
        config:
          prompt: >-
            Review the generated static HTML site. Does it mention "math-utils"
            and describe the library's API functions (add, multiply, clamp)?
            Score 1.0 if yes with real content, 0.5 if partially specific, 0.0
            if still generic demo content.
