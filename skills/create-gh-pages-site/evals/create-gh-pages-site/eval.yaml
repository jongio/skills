name: create-gh-pages-site
description: >-
  Capability eval for the create-gh-pages-site skill. The agent must scaffold a
  working GitHub Pages site with the correct base path injected, the official
  deploy workflow added, and content that reflects the target repo rather than
  generic template demo text. Deterministic graders inspect produced files; an
  LLM rubric judges content quality and template adherence.
type: capability

defaults:
  runs: 1
  timeout: 10m
  executor: copilot-sdk

scoring:
  weights:
    file-exists: 0.15
    file-contains: 0.25
    file-not-contains: 0.10
    prompt: 0.50
  threshold: 0.8

# Grader `path` globs use the shape
# `{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}<file>` instead of a
# plain `**/<file>`. `**` descends into `node_modules`, so a vendored dependency
# that ships a same-named file can satisfy a grader on its own and turn a real
# failure into a false pass. That is not hypothetical: `**/.github/workflows/*.yml`
# matched `hello-cli/node_modules/@ungap/structured-clone/.github/workflows/node.js.yml`
# in CI. It passed only because the real deploy workflow happened to match too.
#
# The grader config accepts only `path` and `negate` (vally's globFiles() calls
# picomatch(pattern) with no options and there is no `ignore` option), so the
# exclusion has to live inside the pattern. `!(node_modules)` guards each leading
# segment. A `**/!(node_modules)/**/` shape does NOT work, because the leading
# `**` absorbs `node_modules` before the guard is ever reached.
#
# Note that `.github` is spelled literally rather than reached through `**`:
# picomatch defaults to `dot: false` and will not descend into a dot-directory.
#
# Verified with picomatch against the layouts the agent produces (site scaffolded
# into a subfolder and into the repo root) plus node_modules negative controls.
# Do not "simplify" these back to `**/`.

stimuli:
  - name: astro-site-for-cli-tool
    prompt: >-
      Use the create-gh-pages-site skill to scaffold an Astro GitHub Pages site
      for the repo "octocat/hello-cli". The repo is a CLI tool. Use the astro
      template. Make sure the base path, deploy workflow, and site content are
      correct for that repo. The current working directory contains the target
      repo fixture; scaffold the site into that directory, not elsewhere.
    tags:
      template: astro
      cost: high
    rubric:
      - The generated content names hello-cli and accurately describes it as a CLI tool.
      - The site content is specific to the target repository rather than template placeholder text.
    environment:
      files:
        - src: fixtures/astro-cli/README.md
          dest: README.md
        - src: fixtures/astro-cli/package.json
          dest: package.json
    graders:
      - type: file-exists
        name: deploy-workflow-created
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
      - type: file-exists
        name: astro-config-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
      - type: file-exists
        name: index-page-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}src/pages/index.astro"
      - type: file-contains
        name: base-path-injected
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
          value: "/hello-cli/"
      - type: file-contains
        name: workflow-uses-deploy-pages
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
          value: "actions/deploy-pages"
      - type: file-not-contains
        name: no-leftover-sentinels
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}astro.config.*"
          value: "__BASE_PATH__"
      - type: file-not-contains
        name: no-generic-site-name
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}src/pages/index.astro"
          value: "__SITE_NAME__"
      - type: prompt
        name: content-reflects-repo
        config:
          prompt: >-
            Review the generated site. Does the content mention "hello-cli" and
            describe it as a CLI tool? Is the content specific to the repo rather
            than generic template placeholder text? Score 1.0 if yes, 0.5 if
            partially, 0.0 if the site still shows default demo content.

  - name: static-html-for-library
    prompt: >-
      Use the create-gh-pages-site skill to scaffold a static HTML GitHub Pages
      site for the repo "octocat/math-utils". The repo is a JavaScript math
      utility library. Use the static-html template. The current working directory
      contains the target repo fixture; scaffold the site into that directory, not
      elsewhere.
    tags:
      template: static-html
      cost: high
    rubric:
      - The generated content names math-utils and describes its add, multiply, and clamp functions.
      - The site contains repository-specific content rather than generic template text.
    environment:
      files:
        - src: fixtures/static-library/README.md
          dest: README.md
        - src: fixtures/static-library/package.json
          dest: package.json
    graders:
      - type: file-exists
        name: deploy-workflow-created
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
      - type: file-exists
        name: index-html-exists
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}index.html"
      - type: file-contains
        name: workflow-uses-deploy-pages
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}.github/workflows/*.yml"
          value: "actions/deploy-pages"
      - type: file-not-contains
        name: no-leftover-sentinels
        config:
          path: "{,!(node_modules)/}{,!(node_modules)/}{,!(node_modules)/}index.html"
          value: "__SITE_NAME__"
      - type: prompt
        name: content-reflects-repo
        config:
          prompt: >-
            Review the generated static HTML site. Does it mention "math-utils"
            and describe the library's API functions (add, multiply, clamp)?
            Score 1.0 if yes with real content, 0.5 if partially specific, 0.0
            if still generic demo content.

  - name: explicit-spectator-specification
    prompt: >-
      Use the create-gh-pages-site skill and the spectator template to publish a
      reviewable GitHub Pages specification for "octocat/reviewable-cache-rfc".
      Use the local template registry at "registry/templates". The current
      directory contains the repository README and proposal-notes.md. Keep the
      content structure free-form, preserve the GitHub feedback and edit
      workflow, and replace all Project Northstar sample content.
    tags:
      template: spectator
      cost: high
    rubric:
      - The generated site accurately describes the offline cache proposal, including read-only behavior, the 24-hour maximum age, and the unresolved storage-location decision.
      - The site uses a free-form specification structure and does not retain Project Northstar sample content.
      - The Spectator review configuration and GitHub Pages base path remain intact.
    environment:
      files:
        - src: fixtures/spectator-repo/README.md
          dest: README.md
        - src: fixtures/spectator-repo/proposal-notes.md
          dest: proposal-notes.md
        - src: fixtures/spectator/template.json
          dest: registry/templates/spectator/template.json
        - src: fixtures/spectator/package.json
          dest: registry/templates/spectator/package.json
        - src: fixtures/spectator/spectator.config.ts
          dest: registry/templates/spectator/spectator.config.ts
        - src: fixtures/spectator/docs/index.md
          dest: registry/templates/spectator/docs/index.md
        - src: fixtures/spectator/docs/proposal.md
          dest: registry/templates/spectator/docs/proposal.md
        - src: fixtures/spectator/docs/system-shape.md
          dest: registry/templates/spectator/docs/system-shape.md
        - src: fixtures/spectator/docs/.vitepress/config.mts
          dest: registry/templates/spectator/docs/.vitepress/config.mts
        - src: fixtures/spectator/docs/.vitepress/theme/index.ts
          dest: registry/templates/spectator/docs/.vitepress/theme/index.ts
        - src: fixtures/spectator/docs/.vitepress/theme/FeedbackPrompt.vue
          dest: registry/templates/spectator/docs/.vitepress/theme/FeedbackPrompt.vue
        - src: fixtures/spectator/docs/.vitepress/theme/SelectionActions.vue
          dest: registry/templates/spectator/docs/.vitepress/theme/SelectionActions.vue
        - src: fixtures/spectator/.github/workflows/deploy.yml
          dest: registry/templates/spectator/.github/workflows/deploy.yml
    graders:
      - type: file-exists
        name: spectator-config-created
        config:
          path: "spectator.config.ts"
      - type: file-exists
        name: spectator-content-created
        config:
          path: "docs/index.md"
      - type: file-exists
        name: deploy-workflow-created
        config:
          path: ".github/workflows/deploy.yml"
      - type: file-contains
        name: project-base-injected
        config:
          path: "spectator.config.ts"
          value: "/reviewable-cache-rfc/"
      - type: file-contains
        name: proposal-content-authored
        config:
          path: "docs/index.md"
          value: "offline"
      - type: file-contains
        name: workflow-uploads-pages-artifact
        config:
          path: ".github/workflows/deploy.yml"
          value: "actions/upload-pages-artifact"
      - type: file-contains
        name: workflow-orders-deploy-after-build
        config:
          path: ".github/workflows/deploy.yml"
          value: "needs: build"
      - type: file-contains
        name: page-feedback-preserved
        config:
          path: "docs/.vitepress/theme/FeedbackPrompt.vue"
          value: "issues/new"
      - type: file-contains
        name: selected-text-feedback-preserved
        config:
          path: "docs/.vitepress/theme/SelectionActions.vue"
          value: "window.getSelection"
      - type: file-contains
        name: edit-page-action-preserved
        config:
          path: "docs/.vitepress/theme/SelectionActions.vue"
          value: "Edit page"
      - type: file-contains
        name: page-feedback-mounted
        config:
          path: "docs/.vitepress/theme/index.ts"
          value: "doc-footer-before"
      - type: file-contains
        name: selection-feedback-mounted
        config:
          path: "docs/.vitepress/theme/index.ts"
          value: "layout-bottom"
      - type: file-not-contains
        name: sample-content-removed
        config:
          path: "docs/index.md"
          value: "Project Northstar"
      - type: file-not-contains
        name: proposal-sample-content-removed
        config:
          path: "docs/proposal.md"
          value: "Project Northstar"
      - type: file-not-contains
        name: system-sample-content-removed
        config:
          path: "docs/system-shape.md"
          value: "Project Northstar"
      - type: prompt
        name: spectator-content-quality
        config:
          prompt: >-
            Review the generated Spectator site. Does it accurately cover the
            offline read-only cache, 24-hour maximum age, cache-only mode,
            security boundary, and open storage-location decision without
            forcing a generic outline? Score 1.0 if yes, 0.5 if partially, and
            0.0 if the content is generic or still uses Project Northstar.

  - name: inferred-spectator-specification
    prompt: >-
      Publish the offline cache proposal in this repository as a GitHub Pages
      website like the Eval Authoring Guide. It should be easy to search and
      navigate, let reviewers comment on a page or selected text through GitHub,
      and let them propose edits. Use the local template registry at
      "registry/templates". Choose the right template from the skill and replace
      all fictional sample content.
    tags:
      template: spectator
      selection: inferred
      cost: high
    rubric:
      - The agent infers that Spectator is the right template for a reviewable technical specification.
      - The generated site accurately reflects the repository proposal notes and keeps content organization free-form.
      - Page, selected-text, and GitHub edit review affordances remain configured.
    environment:
      files:
        - src: fixtures/spectator-repo/README.md
          dest: README.md
        - src: fixtures/spectator-repo/proposal-notes.md
          dest: proposal-notes.md
        - src: fixtures/spectator/template.json
          dest: registry/templates/spectator/template.json
        - src: fixtures/spectator/package.json
          dest: registry/templates/spectator/package.json
        - src: fixtures/spectator/spectator.config.ts
          dest: registry/templates/spectator/spectator.config.ts
        - src: fixtures/spectator/docs/index.md
          dest: registry/templates/spectator/docs/index.md
        - src: fixtures/spectator/docs/proposal.md
          dest: registry/templates/spectator/docs/proposal.md
        - src: fixtures/spectator/docs/system-shape.md
          dest: registry/templates/spectator/docs/system-shape.md
        - src: fixtures/spectator/docs/.vitepress/config.mts
          dest: registry/templates/spectator/docs/.vitepress/config.mts
        - src: fixtures/spectator/docs/.vitepress/theme/index.ts
          dest: registry/templates/spectator/docs/.vitepress/theme/index.ts
        - src: fixtures/spectator/docs/.vitepress/theme/FeedbackPrompt.vue
          dest: registry/templates/spectator/docs/.vitepress/theme/FeedbackPrompt.vue
        - src: fixtures/spectator/docs/.vitepress/theme/SelectionActions.vue
          dest: registry/templates/spectator/docs/.vitepress/theme/SelectionActions.vue
        - src: fixtures/spectator/.github/workflows/deploy.yml
          dest: registry/templates/spectator/.github/workflows/deploy.yml
    graders:
      - type: file-exists
        name: spectator-selected
        config:
          path: "spectator.config.ts"
      - type: file-contains
        name: inferred-project-base
        config:
          path: "spectator.config.ts"
          value: "/reviewable-cache-rfc/"
      - type: file-contains
        name: inferred-content-authored
        config:
          path: "docs/index.md"
          value: "offline"
      - type: file-contains
        name: inferred-page-feedback-preserved
        config:
          path: "docs/.vitepress/theme/FeedbackPrompt.vue"
          value: "issues/new"
      - type: file-contains
        name: inferred-selection-feedback-preserved
        config:
          path: "docs/.vitepress/theme/SelectionActions.vue"
          value: "window.getSelection"
      - type: file-contains
        name: inferred-workflow-uploads-pages-artifact
        config:
          path: ".github/workflows/deploy.yml"
          value: "actions/upload-pages-artifact"
      - type: file-contains
        name: inferred-page-feedback-mounted
        config:
          path: "docs/.vitepress/theme/index.ts"
          value: "doc-footer-before"
      - type: file-contains
        name: inferred-selection-feedback-mounted
        config:
          path: "docs/.vitepress/theme/index.ts"
          value: "layout-bottom"
      - type: file-not-contains
        name: inferred-sample-content-removed
        config:
          path: "docs/index.md"
          value: "Project Northstar"
      - type: file-not-contains
        name: inferred-proposal-sample-content-removed
        config:
          path: "docs/proposal.md"
          value: "Project Northstar"
      - type: file-not-contains
        name: inferred-system-sample-content-removed
        config:
          path: "docs/system-shape.md"
          value: "Project Northstar"
      - type: prompt
        name: inferred-template-quality
        config:
          prompt: >-
            Did the agent select Spectator without being told its name, preserve
            the GitHub review workflow, and author a specific offline cache
            proposal from the repository context? Score 1.0 for all conditions,
            0.5 for partial compliance, and 0.0 for another template or generic
            content.

  - name: skills-catalog-safe-staging
    prompt: >-
      Use the create-gh-pages-site skill and the skills-catalog template to stage
      a GitHub Pages catalog for "octocat/skill-hub". Use the local template
      registry at "registry/templates". Stage into "site-staging" with the
      generator's safe staging and JSON contract. Do not apply or copy the result
      into the current target repository. Preserve do-not-overwrite.txt.
    tags:
      template: skills-catalog
      contract: staging
      cost: low
    rubric:
      - The agent uses skills-catalog and safe staging instead of applying directly to the target.
      - The staged project base is /skill-hub/ and no target-owned file is overwritten.
      - The agent treats the JSON result as the composition handoff.
    environment:
      files:
        - src: fixtures/skills-repo/README.md
          dest: README.md
        - src: fixtures/skills-repo/do-not-overwrite.txt
          dest: do-not-overwrite.txt
        - src: fixtures/skills-repo/alpha-skill.md
          dest: skills/alpha/SKILL.md
        - src: fixtures/skills-catalog/template.json
          dest: registry/templates/skills-catalog/template.json
        - src: fixtures/skills-catalog/index.html
          dest: registry/templates/skills-catalog/index.html
        - src: fixtures/skills-catalog/deploy.yml
          dest: registry/templates/skills-catalog/.github/workflows/deploy.yml
    graders:
      - type: file-exists
        name: staged-catalog-exists
        config:
          path: "site-staging/index.html"
      - type: file-exists
        name: staged-workflow-exists
        config:
          path: "site-staging/.github/workflows/deploy.yml"
      - type: file-contains
        name: project-base-injected
        config:
          path: "site-staging/index.html"
          value: "/skill-hub/"
      - type: file-contains
        name: target-file-preserved
        config:
          path: "do-not-overwrite.txt"
          value: "consumer-owned"
      - type: file-contains
        name: workflow-action-is-sha-pinned
        config:
          path: "site-staging/.github/workflows/deploy.yml"
          value: "actions/checkout@0123456789abcdef0123456789abcdef01234567"
      - type: file-not-contains
        name: no-leftover-sentinel
        config:
          path: "site-staging/index.html"
          value: "__BASE_PATH__"
      - type: prompt
        name: safe-composition-contract
        config:
          prompt: >-
            Did the agent use the skills-catalog template through --staging-dir
            and --json, leave the current target untouched, and report the staged
            directory as the composition handoff? Score 1.0 for all conditions,
            0.5 for partial staging behavior, and 0.0 for direct target apply.
