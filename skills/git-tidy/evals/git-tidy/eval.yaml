            - name: "^(?:create_issue|create_pull_request|update_pull_request|reply_and_resolve_review_thread|workiq-create_entity|workiq-update_entity|workiq-delete_entity|workiq-do_action)$"

  - name: defaults-to-git-clean-report
    prompt: >-
      Use the git-tidy skill for a normal interactive run. The completed
      proof-depth analysis found two concrete proved cleanup actions. The first
      removes clean worktree C:\code\worktrees\feature-a while retaining linked
      branch feature/a. The second deletes local branch old-fix because all of
      its commits are already reachable from default branch main. Branch
      deps/update needs review because it is 16 commits behind main. Worktree
      C:\code\worktrees\feature-b must be kept because it has uncommitted
      changes. Main is protected as the default branch. No content review has
      been applied and no action is approved. Show what the user should
      experience next.
    tags:
      scenario: guided-triage
      cost: low
    rubric:
      - It renders Safe to Remove, Needs Review, Keep, and Skipped sections before selection.
      - It lists both exact removal targets, what remains, and why each action is safe.
      - It lists deps/update, the dirty feature-b worktree, and protected main in their correct sections.
      - It offers all visible safe items, specific row numbers, medium review, keep everything, and evidence.
      - It invokes ask_user with those choices instead of ending with prose.
      - Cleanup selection remains separate from mutation approval.
    graders:
      - type: prompt
        name: interactive-run-stays-cleanup-first
        config:
          scoring: scale_1_5
          threshold: 0.75
          prompt: >-
            Score 5 only if the response visibly follows the Git Clean pattern:
            categorized Safe to Remove, Needs Review, Keep, and Skipped sections
            with numbered rows. It must list C:\code\worktrees\feature-a with
            retained branch feature/a, old-fix with main, deps/update as needing
            review, dirty feature-b as keep, and main as protected before
            invoking ask_user. Choices must support all visible safe rows,
            specific numbers, medium review, keep everything, and evidence
            without implying mutation approval. Score 1 if it presents only
            counts, a removal-only queue, repeated decision cards, or hidden
            identities.
      - type: skill-invocation
        config:
          required: [git-tidy]
      - type: diff-empty
      - type: tool-calls
        config:
          disallowed:
            - name: "^(?:powershell|bash)$"
