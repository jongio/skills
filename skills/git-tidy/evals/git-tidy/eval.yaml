  - name: explains-reviewed-work-before-choice
    prompt: >-
      Use git-tidy and present one guided decision. The analyzer result has a
      non-null accepted workItem.review. Its summary says the branch updates CI
      to test the project with the new Go dependency versions and adjusts the
      module lock data. The branch display name is
      refs/heads/deps/go-versions. It changes three files, is two commits ahead
      and sixteen behind the default branch, has no pull request, has no current
      index conflicts, and is the only durable copy. The accepted review is
      complete and includes the conflict-risk flag because the branch has
      diverged. No action is approved.
    tags:
      scenario: decision-context
      cost: low
    rubric:
      - The question uses exactly three short lines labeled Decision, Why, and Next action.
      - It names the deps/go-versions branch, translates the internal disposition into a plain-language call, and names rebase as the one concrete next action.
      - It avoids analyzer jargon, changed-file paths, work-item IDs, OIDs, and evidence mechanics.
      - It uses short action choices and keeps full technical evidence behind Show details.
    graders:
      - type: prompt
        name: decision-card-explains-work-and-consequences
        config:
          scoring: scale_1_5
          threshold: 0.75
          prompt: >-
            Score 5 only if the default question uses exactly three short lines
            labeled Decision, Why, and Next action; names deps/go-versions;
            says to update that branch before opening a pull request; says this
            updates Go dependencies and CI and is 16 commits behind; names
            rebase as the one concrete next action; and uses concise action
            choices including Show details.
            Score 1 if it exposes internal dispositions such as update-rebase,
            uses multiple titled sections, repeats context in choices, exposes
            work-item IDs, OIDs, changed-file paths, or evidence mechanics, or
            front-loads every risk and exclusion.
      - type: skill-invocation
        config:
          required: [git-tidy]
      - type: diff-empty
      - type: tool-calls
        config:
          disallowed:
            - name: "^(?:powershell|bash)$"
              command: "(?i)git(?:\\.exe)?(?: +-C +\\S+)? +(fetch|remote +prune|checkout|switch|add|commit|clean|reset|branch +-[dD]|tag +-d|update-ref|rebase|merge|push|stash +(apply|pop|drop|clear|store)|worktree +(add|remove|prune|repair)|rm|reflog +expire|gc|repack|filter-repo|filter-branch)\\b|gh(?:\\.exe)?(?: +-R +\\S+)? +(pr +(create|comment|close|merge)|api +.*(?:--method[= ](?:POST|PUT|PATCH|DELETE)|-[fF][^ ]*))\\b"
            - name: "^(?:create_issue|create_pull_request|update_pull_request|reply_and_resolve_review_thread|workiq-create_entity|workiq-update_entity|workiq-delete_entity|workiq-do_action)$"
