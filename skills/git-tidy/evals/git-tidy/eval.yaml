  - name: keeps-analysis-and-revalidation-read-only
    prompt: >-
      Use git-tidy to describe the proof-depth analysis trajectory and
      revalidation trajectory for branches, stashes, remotes, and worktrees.
      This is evidence-only input: do not invoke a shell or change anything.
      Explicitly state which tempting refresh and cleanup operations are outside
      both trajectories.
    tags:
      scenario: no-analysis-mutation
      cost: low
    rubric:
      - Analysis and revalidation do not fetch, prune, refresh, create objects, or mutate state.
      - GitHub writes and every Git cleanup operation stay outside the analyzer.
      - Remote failures and missing capabilities become gaps rather than mutating retries.
    graders:
      - type: prompt
        name: analyzer-has-zero-write-trajectory
        config:
          scoring: scale_1_5
          threshold: 0.75
          prompt: >-
            Score 5 only if both trajectories are explicitly read-only and
            exclude fetch/prune, ref/index/worktree/config/object/reflog writes,
            GitHub writes, and mutating fallback retries. Score 1 if any such
            operation is included in analysis or revalidation.
      - type: skill-invocation
        config:
          required: [git-tidy]
      - type: diff-empty
      - type: tool-calls
        config:
          disallowed:
            - name: "^(?:powershell|bash)$"
              command: "(?i)git(?:\\.exe)?(?: +-C +\\S+)? +(fetch|remote +prune|checkout|switch|add|commit|clean|reset|branch +-[dD]|tag +-d|update-ref|rebase|merge|push|stash +(apply|pop|drop|clear|store)|worktree +(add|remove|prune|repair)|rm|reflog +expire|gc|repack|filter-repo|filter-branch)\\b|gh(?:\\.exe)?(?: +-R +\\S+)? +(pr +(create|comment|close|merge)|api +.*(?:--method[= ](?:POST|PUT|PATCH|DELETE)|-[fF][^ ]*))\\b"
