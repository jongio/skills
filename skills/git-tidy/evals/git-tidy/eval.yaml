            - name: "^(?:create_issue|create_pull_request|update_pull_request|reply_and_resolve_review_thread|workiq-create_entity|workiq-update_entity|workiq-delete_entity|workiq-do_action)$"

  - name: batches-large-git-clean-report
    prompt: >-
      Use git-tidy to present the first decision for a large repository. The
      accepted analyzer result contains 99 mechanically proven carrier cleanup
      actions across 80 work groups, 3 items that need review, and 6 items that
      must be kept. The first batch is ten clean worktrees named
      C:\worktrees\cleanup-01 through C:\worktrees\cleanup-10. Each worktree has
      a retained linked branch named cleanup-01 through cleanup-10. The review
      items are local branches review-01 through review-03. The keep items are
      dirty worktrees C:\worktrees\keep-01 through C:\worktrees\keep-06. Main is
      protected as the default branch. No content review or cleanup is approved.
    tags:
      scenario: decision-dashboard
      cost: low
    rubric:
      - It renders Safe to Remove, Needs Review, Keep, and Skipped sections in the Git Clean report format.
      - It itemizes the first ten worktree paths and retained branch names before selection.
      - It lists review-01 through review-03, keep-01 through keep-06, and protected main in their correct sections.
      - It uses stable global row numbers across all visible sections.
      - It says 89 safe actions remain and never offers selection of all 99.
      - The complete report is inside the interactive question, not detached from a context-free menu.
      - The choices apply only to visible rows and include specific numbers, medium review, keep everything, and evidence.
    graders:
      - type: prompt
        name: large-repository-dashboard-is-compact
        config:
          scoring: scale_1_5
          threshold: 0.75
          prompt: >-
            Score 5 only if the response uses categorized Safe to Remove, Needs
            Review, Keep, and Skipped sections with stable global row numbers.
            It must state that 99 concrete actions across 80 work groups are
            safe, list cleanup-01 through cleanup-10 with matching retained
            branches, list review-01 through review-03, dirty keep-01 through
            keep-06, and protected main in their correct sections, say 89 safe
            actions remain, and place that complete report inside the interactive
            question with choices limited to visible rows. Score 1 if the final
            question is a context-free menu, any category is omitted, it offers
            removal of all 99, hides target identities, or exposes OIDs and
            proof mechanics.
