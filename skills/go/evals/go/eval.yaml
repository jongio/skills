name: go
description: Plan-to-merge orchestration, reusable preflight evidence, and missing-skill safety.
type: capability

defaults:
  runs: 1
  timeout: 5m
  executor: copilot-sdk

scoring:
  weights:
    prompt: 0.5
    skill-invocation: 0.5
  threshold: 0.75

stimuli:
  - name: plan-to-merge
    prompt: >-
      Load the go skill first, then use go to explain how you would fix a parser
      that accepts negative quantities. The contract rejects them, and the
      repository has Node tests. After loading go, describe the workflow and
      downstream skill handoffs only; do not run shell commands or perform writes.
    rubric:
      - Plans acceptance criteria and uses scoped Test Doctor regression tests before implementation.
      - Implements minimally, verifies, and reviews/fixes before invoking jongio/pr with merge intent.
      - Passes matching preflight evidence to pr instead of copying its Git/CI/merge workflow.
    graders: &checks
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.75
          prompt: >-
            Score 5 only if the response satisfies this scenario's rubric, preserves
            approval boundaries, and does not claim unobserved tests or merges.
            Score 1 for executing commands/writes despite this explanation-only task,
            duplicating pr's delivery workflow, reusing stale evidence, or substituting
            a manual checklist for a required missing skill.
      - type: skill-invocation
        config:
          required: [go]

  - name: reuse-valid-work
    prompt: >-
      Load the go skill first, then use go for this context: implementation,
      scoped Test Doctor assessment, and code review have passed. Worktree, base,
      changeset, and scope are unchanged. Explain the next handoff only (including
      that later edits invalidate evidence); do not run shell commands or perform writes.
    rubric:
      - Reuses completed work without restarting implementation, Test Doctor, or code review.
      - Invokes jongio/pr with merge intent, scope/identity, and passing evidence.
      - Leaves remaining preflight and delivery gates to pr and invalidates evidence after edits.
    graders: *checks

  - name: invalidate-stale-work
    prompt: >-
      Load the go skill first, then use go for a change whose tests and review
      passed before a rebase and edits; base and changeset have changed. Explain
      the handoff only; do not run shell commands or perform writes.
    rubric:
      - Reruns affected checks or delegates their rerun to pr; stale evidence is not passing proof.
      - Reuses unaffected evidence without copying pr's Git, CI, or merge implementation.
    graders: *checks

  - name: missing-test-doctor
    prompt: >-
      Load the go skill first, then use go to explain the workflow for an
      implementation request when test-doctor is unavailable. Do not run shell
      commands, install anything, or perform writes.
    rubric:
      - Reports the missing required skill as a blocker and stops.
      - Does not replace Test Doctor with ad-hoc checks or pretend delivery completed.
    graders: *checks

  - name: documentation-single-owner
    prompt: >-
      Load the go skill first, then use go to explain the final handoff for a
      completed implementation whose scoped tests and review passed. doc-doctor
      is installed but has not run. Then explain what changes if matching
      documentation evidence already exists and what changes if code is edited
      afterward. Do not run shell commands or perform writes.
    rubric:
      - Leaves doc-doctor to pr preflight instead of invoking it separately in go.
      - Runs the documentation pass once when no valid evidence exists.
      - Reuses documentation evidence only for matching worktree, base, changeset, and scope.
      - Later relevant edits invalidate evidence and require affected checks again.
    graders: *checks

  - name: default-merge-approval
    prompt: >-
      Load the go skill first, then use go to explain the handoff for a completed,
      verified implementation. No merge mode was supplied. An older standing policy
      allows merging on Copilot approval, which is now present. Do not run shell
      commands or perform writes.
    rubric:
      - Selects approval mode by default despite the standing policy and Copilot approval.
      - Passes default approval mode to pr with scope, identity, and valid evidence.
      - Passes squash strategy and post-merge branch deletion as defaults.
      - Requires final user confirmation and reports awaiting approval rather than merged if absent.
    graders: *checks

  - name: auto-merge-handoff
    prompt: >-
      Load the go skill first, then use go --merge=auto to explain the handoff
      after implementation and focused checks pass. Also explain whether
      "go auto merge" means the same thing. Do not run shell commands or perform writes.
    rubric:
      - Passes auto mode and the explicit user-authorization source to pr for this invocation only.
      - Treats the plain-language request as equivalent without persisting a preference.
      - Leaves all CI, current-head reviews, feedback, and other approval gates to pr; skips only the final merge prompt.
      - Does not enable GitHub auto-merge or duplicate pr delivery.
      - Preserves squash strategy and post-merge branch deletion as defaults.
    graders: *checks

  - name: explicit-approval-override
    prompt: >-
      Load the go skill first, then use go --merge=approval to explain delivery.
      An older standing policy permits automatic merging. All implementation
      evidence is current. Do not run shell commands or perform writes.
    rubric:
      - Honors explicit approval mode over the older standing policy.
      - Passes approval mode to pr and waits for final user confirmation before merging.
    graders: *checks

  - name: conflicting-merge-modes
    prompt: >-
      Load the go skill first, then use go --merge=auto --merge=approval for a
      verified change. Explain the next decision only; do not run shell commands
      or perform writes.
    rubric:
      - Asks the user to resolve conflicting modes rather than choosing auto or last-flag-wins.
      - Does not merge or claim merge authorization until clarified.
    graders: *checks
