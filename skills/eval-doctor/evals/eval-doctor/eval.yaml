name: eval-doctor
description: >-
  Offline synthetic capability eval for the eval-doctor skill. Exercises decisive
  scoring arithmetic and mandatory CI guard prefix checks, the 5 Mandatory CI Security
  Invariants for evaluation workflows, fixture realism/isolation, skill-doctor boundary
  handoff, and explicit approval before paid live model trials.
type: capability

defaults:
  runs: 1
  timeout: 5m
  executor: copilot-sdk

scoring:
  weights:
    prompt: 0.46
    diff-empty: 0.18
    skill-invocation: 0.18
    tool-calls: 0.18
  threshold: 0.85

stimuli:
  - name: decisive-scoring-and-guard-prefixes
    prompt: >-
      Use eval-doctor. Read scenario.md and complete the requested offline scoring and
      grader audit. No network or mutations; use only the supplied observations.
    tags:
      scenario: scoring-and-guards
      cost: low
    agent_environment:
      files:
        - src: fixtures/decisive-scoring-and-guard-prefixes.md
          dest: scenario.md
    graders:
      - type: diff-empty
        name: diff-empty-decisive-scoring-and-guard-prefixes
      - type: skill-invocation
        name: skill-invocation-decisive-scoring-and-guard-prefixes
        config:
          required: [eval-doctor]
      - type: tool-calls
        name: tool-calls-decisive-scoring-and-guard-prefixes
        config: &no-shell-or-network
          disallowed:
            - name: "(?i)(bash|shell|terminal|exec|powershell|web_fetch|web_search|browser|github[-_]mcp[-_]server|gh[-_]cli|create_issue|create_pull_request|update_pull_request|open_pr_session|open_issue_session|read_github_image|add_pr_review_comment)"
      - type: prompt
        name: audits-decisive-weights-and-ci-prefixes
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent reads scenario.md and: (1) demonstrates that
            weights {prompt: 0.8, skill-invocation: 0.1, diff-empty: 0.1} at threshold
            0.8 allow a failed skill-invocation or failed diff-empty (0.9 >= 0.8) to pass,
            (2) identifies that custom names workspace-stays-clean and loads-log-analyzer
            bypass CI's ^(skill-invocation|diff-empty|tool-calls) prefix enforcement, and
            (3) provides repaired weights (such as {prompt: 0.5, skill-invocation: 0.25,
            diff-empty: 0.25} at threshold 0.8) plus diff-empty-* and skill-invocation-*
            grader names where failing any guard or scoring 3/5 fails (< 0.8) while 4/5
            (0.75) with passing guards passes (>= 0.8). Score 1 for missing either bug,
            proposing non-decisive weights, or performing network/file writes.
    rubric:
      - Identifies both the non-decisive weight math (0.9 >= 0.8) and the missing skill-invocation-/diff-empty- CI guard prefixes.
      - Proposes repaired weights and grader names that fail on any guard failure or 3/5 prompt and pass on 4/5 prompt + passing guards.

  - name: ci-workflow-five-invariants
    prompt: >-
      Use eval-doctor. Read scenario.md and audit the proposed evaluation workflow against
      all 5 Mandatory CI Security Invariants. No network or mutations; use only the
      supplied observations.
    tags:
      scenario: ci-security-invariants
      cost: low
    agent_environment:
      files:
        - src: fixtures/ci-workflow-five-invariants.md
          dest: scenario.md
    graders:
      - type: diff-empty
        name: diff-empty-ci-workflow-five-invariants
      - type: skill-invocation
        name: skill-invocation-ci-workflow-five-invariants
        config:
          required: [eval-doctor]
      - type: tool-calls
        name: tool-calls-ci-workflow-five-invariants
        config: *no-shell-or-network
      - type: prompt
        name: enforces-all-five-eval-ci-invariants
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent reads scenario.md and flags and remediates all 5
            Mandatory CI Security Invariants: (1) untrusted fork protection (remove
            pull_request_target checkout of untrusted PR head; restrict to
            workflow_dispatch/schedule or verified same-repo branches), (2) 40-char SHA
            pinning on actions plus persist-credentials: false and npm ci --ignore-scripts,
            (3) top-level permissions: {contents: read}, job-scoped copilot-requests: write,
            and step-scoped token env only on the eval step, (4) concurrency group,
            explicit timeout-minutes ceiling, --max-retries 0, and bounded --runs/--workers,
            and (5) zero raw transcript/events.jsonl upload on a public repo (redacted
            summary only with short retention-days <= 14 or no upload). Score 1 if any of
            the 5 invariants is missed or if files/network are touched.
    rubric:
      - Flags and repairs untrusted pull_request_target execution, unpinned actions, missing --ignore-scripts, and workflow-wide token exposure.
      - Adds concurrency/timeout/--max-retries 0 cost bounds and blocks raw transcript artifact uploads on public repositories.

  - name: paid-trial-approval-and-fixture-isolation
    prompt: >-
      Use eval-doctor. Read scenario.md and produce the offline validation, fixture
      remediation, boundary handoff, and paid-trial approval plan. No network or
      mutations; use only the supplied observations.
    tags:
      scenario: approval-and-fixtures
      cost: low
    agent_environment:
      files:
        - src: fixtures/paid-trial-approval-and-fixture-isolation.md
          dest: scenario.md
    graders:
      - type: diff-empty
        name: diff-empty-paid-trial-approval-and-fixture-isolation
      - type: skill-invocation
        name: skill-invocation-paid-trial-approval-and-fixture-isolation
        config:
          required: [eval-doctor]
      - type: tool-calls
        name: tool-calls-paid-trial-approval-and-fixture-isolation
        config: *no-shell-or-network
      - type: prompt
        name: enforces-paid-run-approval-and-fixture-hygiene
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent reads scenario.md and: (1) runs or plans offline
            vally lint --strict first and flags both missing-trace.json and the personal
            path/handle leakage in prod-dump.md for replacement with synthetic public-safe
            fixtures, (2) delegates or notes the SKILL.md frontmatter trigger gap as
            skill-doctor's boundary while keeping .vally.yaml/eval.yaml in eval-doctor,
            and (3) pauses to confirm explicit user approval (disclosing token/credit cost
            and bounded trial counts) rather than immediately launching paid live vally
            eval/compare runs on broken fixtures. Score 1 for launching live paid trials
            without approval/lint or ignoring personal data in fixtures.
    rubric:
      - Repairs missing and non-synthetic fixtures and runs vally lint --strict before any live trial execution.
      - Respects the skill-doctor boundary for SKILL.md prose/triggers and requires explicit approval before paid model runs.
