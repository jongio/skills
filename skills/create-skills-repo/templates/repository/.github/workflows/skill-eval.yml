name: Skill Eval

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to evaluate by id or path. Leave empty to run every skill."
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: skill-eval
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select skills to evaluate
        id: select
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          matrix_file="$RUNNER_TEMP/skill-eval-matrix.jsonl"
          : > "$matrix_file"
          while IFS= read -r spec; do
            skill_dir=${spec%%/evals/*}
            skill_id=${skill_dir#skills/}
            expected="$skill_dir/evals/$skill_id/eval.yaml"
            if [[ ! "$skill_id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] ||
               [ "$spec" != "$expected" ] ||
               [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "::error::Refusing non-canonical eval specification path."
              exit 1
            fi
            eval_spec=${spec#"$skill_dir/"}
            jq -cn \
              --arg skill "$skill_dir" \
              --arg skill_id "$skill_id" \
              --arg eval_spec "$eval_spec" \
              '{skill:$skill, skill_id:$skill_id, eval_spec:$eval_spec}' \
              >> "$matrix_file"
          done < <(
            find skills -mindepth 4 -maxdepth 4 -type f \
              -path 'skills/*/evals/*/eval.yaml' -print | LC_ALL=C sort
          )
          all=$(jq -sc '.' "$matrix_file")
          if [ "$(jq 'length' <<<"$all")" -eq 0 ]; then
            echo "::error::No canonical skill eval specifications were found."
            exit 1
          fi
          if [ -z "${SKILL:-}" ]; then
            selected=$(jq -c . <<<"$all")
          else
            selected=$(jq -c --arg s "$SKILL" '[.[] | select(.skill_id == $s or .skill == $s)]' <<<"$all")
            if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
              echo "::error::Requested skill was not discovered."
              exit 1
            fi
          fi
          count=$(jq 'length' <<<"$selected")
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  eval:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ".github/tools/vally/package-lock.json"

      - name: Install locked validation tools
        run: npm ci --prefix .github/tools/vally --ignore-scripts --no-audit --no-fund

      - name: Run eval
        working-directory: ${{ matrix.skill }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_SPEC: ${{ matrix.eval_spec }}
          VALLY_BIN: ${{ github.workspace }}/.github/tools/vally/node_modules/.bin/vally
        run: |
          "$VALLY_BIN" eval \
            --eval-spec "$EVAL_SPEC" \
            --skill-dir . \
            --output-dir ./vally-results \
            --runs 5 \
            --workers 2 \
            --max-retries 0

      - name: Report eval diagnostics
        if: always()
        working-directory: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          if [ ! -d vally-results ]; then
            echo "::error::Vally produced no result directory; inspect the eval process failure."
            exit 1
          fi
          summary=$(find vally-results -name results.jsonl -type f -print -quit)
          if [ -z "$summary" ]; then
            echo "::error::Vally produced no result records; this is not evidence of a passing eval."
            exit 1
          fi
          jq -c '
            if .type == "run-summary" then
              {type, passed, hadExecutionErrors, evals: [.evals[] |
                {name, passed, scoringApplied, overallScore, threshold}]}
            elif .type == "trial-result" and
              any(.gradeResult.details[]; .passed != true) then
              {type, stimulus, graders: [.gradeResult.details[] |
                select(.passed != true) | {name, passed, score}]}
            else empty end
          ' "$summary"

      - name: Assert eval passed
        working-directory: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          summary=$(find vally-results -name results.jsonl -type f -print -quit)
          test -n "$summary"
          jq -s -e '
            ([.[] | select(.type == "trial-result")] | group_by(.stimulus)) as $stimuli |
            ([.[] | select(.type == "run-summary")] | last) as $run |
            ($run.passed == true) and
            ($run.hadExecutionErrors == false) and
            ($run.evals | length > 0) and
            ($run.evals | all(
              (.passed == true) and
              (.scoringApplied == true) and
              (.overallScore >= .threshold)
            )) and
            ($stimuli | length > 0) and
            ($stimuli | all(
              all(.[].gradeResult.details[];
                if (.name | test("^(skill-invocation|diff-empty|tool-calls)"))
                then .passed == true
                else true
                end
              )
            ))
          ' "$summary" > /dev/null
