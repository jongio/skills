name: pr
description: >-
  Capability eval for the pr skill. Verifies preflight checklist execution,
  verified owner-specific private repository exceptions, exact-head review
  completion, embedded review-body findings, bot vs human comment resolution,
  bounded progress reporting, authorized head-pinned merge, and verified
  post-merge related-issue reconciliation.
type: capability

defaults:
  runs: 1
  timeout: 10m
  executor: copilot-sdk

scoring:
  weights:
    prompt: 0.333334
    diff-empty: 0.333333
    skill-invocation: 0.333333
  threshold: 0.8

stimuli:
  - name: verified-private-owner-exception
    prompt: >-
      Use the pr skill to plan the PR workflow for uncommitted changes in a
      private repository owned by sample-owner. The user explicitly exempts
      private repositories owned by sample-owner from requesting or waiting
      for Copilot review. One Copilot request is already pending, with posted
      feedback, and a required human review is outstanding. The user requests
      auto-merge. Treat these as scenario facts; do not run repository or network
      writes. State the exact checklist and remaining merge gates.
    tags:
      scenario: workflow
      cost: low
    rubric:
      - Commits uncommitted changes and runs code review, doc-doctor, test-doctor, light security review, lint, and build before submitting.
      - Verifies both the exact allowed owner and private visibility before skipping Copilot requests and waits, including the pending request.
      - Still addresses posted feedback and waits for required human review on the final head.
      - Accepts the explicit auto mode for this invocation but rejects GitHub auto-merge and retains all gates for a literal head-pinned merge followed by merged-state verification.
    graders:
      - type: diff-empty
        name: plan-does-not-mutate-files
      - type: prompt
        name: private-repo-workflow
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the response follows the pr checklist (commit, code review,
            doc-doctor, test-doctor, light security review, lint, build, template-preserving PR body with
            exact validation commands/results, monitor CI/mergeability/comments), verifies both
            owner and private visibility before applying the explicit exception including
            the pending Copilot request, and retains posted feedback and human review gates.
            It must accept invocation-only auto mode, reject GitHub auto-merge and require an authorized literal head-pinned command
            plus merged-state verification. Score 1 if it treats all private repositories as
            exempt, waits for exempt Copilot review, waives human review, or enables GitHub auto-merge.
      - type: skill-invocation
        config:
          required: [pr]

  - name: long-running-gate-and-approval-wait
    prompt: >-
      Use pr to explain status reporting for this synthetic delivery. A
      required coverage stage has exceeded its documented runtime budget.
      Its log still shows the unchanged baseline suite running. Later, a
      separately required approval has not arrived; six hours pass with no
      command executing. The user asks why delivery is taking so long.
      No commands, edits, agents, or network calls are authorized.
    tags:
      scenario: progress-reporting
      cost: low
    rubric:
      - Reports stage, elapsed time, last meaningful result and next event at least every 60 seconds during active execution without tight polling.
      - Inspects bounded stage evidence and reports the exceeded runtime budget without inventing an ETA.
      - Separates wall-clock time from active execution and clearly identifies the exact pending approval and paused execution.
      - Does not restart expensive checks, weaken gates, redesign the workflow or perform writes without authorization.
    graders:
      - type: diff-empty
        name: progress-plan-does-not-write
      - type: prompt
        name: honest-bounded-progress
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent plans meaningful active-execution
            updates at least every 60 seconds using notifications or
            scheduling rather than tight polling, surfaces the runtime
            budget overrun using bounded evidence, and does not restart
            expensive checks, weaken gates or redesign the workflow without
            authorization. It must identify the exact pending approval,
            state execution is paused and separate six hours of wall-clock
            waiting from active execution without inventing an ETA.
            Score 1 for silent waiting, claiming continuous execution,
            unauthorized changes or calls, or a fabricated completion time.
      - type: skill-invocation
        config:
          required: [pr]

  - name: other-private-owner-requires-current-head-review
    prompt: >-
      Use the pr skill to plan a merge for a private repository owned by other-owner.
      The user's only Copilot exception is for private repositories owned by
      sample-owner. CI is green, mergeability is clean, review requests are empty,
      and reviewDecision is APPROVED. Copilot approved the previous head, then a
      fix was pushed. A required human reviewer submitted COMMENTED on the new
      head, and an outdated bot thread remains unaddressed. No merge authorization
      has been given. Do not perform repository or network writes; explain the gates.
    tags:
      scenario: exact-head-review
      cost: low
    rubric:
      - Requires Copilot review because the private owner does not match the explicit exception.
      - Tracks every expected reviewer and requires actual submitted non-dismissed reviews on the final full head OID; new pushes invalidate evidence.
      - Distinguishes COMMENTED completion from required approval; CI, mergeability, reviewDecision, and empty requests do not establish review completion.
      - Addresses outdated feedback and requires merge authorization and a literal repository/PR/full-head-pinned command without bypasses, then verifies merged state.
    graders:
      - type: diff-empty
        name: merge-plan-does-not-mutate-files
      - type: prompt
        name: exact-head-review-gates
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if Copilot remains required for the non-exempt owner and its old-head
            approval is insufficient. Require actual final-head submitted reviews from every
            expected reviewer, separate COMMENTED completion from required approval, reject
            CI/mergeability/reviewDecision/empty requests as completion evidence, address the
            outdated thread, and obtain merge authorization. Require one literal gh pr merge
            command naming repository, PR number, authorized strategy and full --match-head-commit,
            followed by merged-state verification, with no auto/admin/raw API/wrapper bypass.
            Score 1 if it says merge-ready or treats private visibility alone as an exception.
      - type: skill-invocation
        config:
          required: [pr]

  - name: clean-headline-hides-body-only-finding
    prompt: |
      Use the pr skill to assess this complete synthetic PR review evidence.
      Plan only; do not perform repository or network writes. CI is green,
      the PR is up to date, and required approvals are satisfied. The paginated
      inline-comment and thread collections are empty. The submitted Copilot
      review body on the current head is:

      <!-- ccr-overview-v2 -->
      ### Needs a closer look
      **No open issues**
      <details>
      <summary><strong>1 previously missed issue</strong></summary>
      In code that hasn't changed since last review
      <details>
      <summary>Medium: Configured timeout is ignored</summary>
      `src/client.ts:42`
      The request still uses a hard-coded 60-second timeout instead of the
      caller's configured timeout. Current code inspection confirms this.
      Thread creation was unavailable; this finding exists only in review R17.
      </details>
      </details>

      Can the workflow declare review feedback clear, and what happens next?
    tags:
      scenario: embedded-review-finding
      cost: low
    rubric:
      - Identifies the ignored configured timeout inside the nested review body.
      - Does not trust No open issues or empty inline/thread collections as an all-clear.
      - Keeps the finding blocking until fixed and verified or explicitly settled with evidence.
      - Plans a PR reply identifying review R17 and the heading without claiming a thread was resolved.
    graders:
      - type: diff-empty
        name: embedded-finding-plan-is-read-only
      - type: prompt
        name: catches-issue-hidden-by-clean-headline
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent identifies the configured-timeout defect
            in the nested review body, refuses an all-clear despite the clean
            headline and empty thread collections, plans a verified fix or
            evidence-backed settlement, and plans a PR reply citing R17 and
            the finding heading. Score 1 if it merges or enables auto-merge
            before disposition, ignores unchanged-code findings, claims a
            nonexistent thread resolved, or performs writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: deduplicate-and-revalidate-review-body-findings
    prompt: >-
      Use the pr skill to plan remediation using this complete synthetic
      evidence; do not perform writes. Copilot review R20 has a body section
      called "Resolved findings" describing missing pagination. Current-head
      inspection shows pagination is still absent and data is truncated after
      the first page. The same concern is repeated in inline thread T5, linked
      from the body. An older review R19 reports incorrect date formatting;
      current-head code and regression tests prove that date issue fixed.
      A PR conversation comment asks an unanswered human design question.
      CI passes. How many distinct code findings need work and how should
      the workflow handle each source of feedback before merging?
    tags:
      scenario: finding-reconciliation
      cost: low
    rubric:
      - Tracks one open pagination defect despite duplicate body and inline reports.
      - Does not trust the Resolved findings label over current code evidence.
      - Records the old date-formatting finding as verified fixed rather than reopening it.
      - Keeps the unanswered human design question open and withholds an all-clear.
    graders:
      - type: diff-empty
        name: finding-reconciliation-is-read-only
      - type: prompt
        name: reconciles-sources-against-current-head
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent counts one distinct open code defect
            (pagination), links its body and inline reports, rejects the stale
            resolved label using current evidence, preserves the verified
            date fix, and leaves the human design question open. Score 1 if it
            double-counts pagination, declares it resolved, reopens the proven
            date fix without cause, resolves the human question, or performs writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: bot-vs-human-comment-resolution
    prompt: >-
      Use the pr skill to explain how to handle an open PR that is behind the
      base branch but has no merge conflicts or enforced up-to-date requirement,
      has one failing CI check, one Copilot review comment pointing
      out a bug, and one human reviewer comment asking an open design question.
      Do not perform network or repository writes.
    tags:
      scenario: remediation
      cost: low
    rubric:
      - Does not rebase merely because the branch is behind; investigates and fixes the failing CI check.
      - Fixes the bug, replies to both comments, resolves the automated Copilot thread, and leaves the human reviewer's open question unresolved.
    graders:
      - type: diff-empty
        name: explanation-does-not-mutate-files
      - type: prompt
        name: comment-and-ci-remediation
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent avoids rebasing merely because the branch is behind,
            investigates and fixes the failing CI check,
            address and reply to both review comments, resolve the automated Copilot review thread,
            and keep the human reviewer's open-question thread open. Score 1 if it resolves the
            human's open question, ignores the failing CI, or unnecessarily updates from base.
      - type: skill-invocation
        config:
          required: [pr]

  - name: behind-base-preserves-head
    prompt: >-
      Use pr to explain what to do before submission, during monitoring, and
      immediately before merge when the branch is behind base by four commits.
      There are no merge conflicts, no enforced up-to-date requirement, and no
      source changes needed. During monitoring CI is initially pending, then
      passing; all expected reviews are complete on the current head. Base
      advances again without introducing conflicts or a freshness requirement.
      No commands, edits, agents, or network calls are authorized.
    tags:
      scenario: base-update-gate
      cost: low
    rubric:
      - Preserves the head before submission, during monitoring, and before merge despite divergence alone.
      - Does not rebase, merge from base, use update-branch, or push merely to catch up.
      - Rechecks actual merge gates without needlessly invalidating pending or passing CI and current-head reviews.
    graders:
      - type: diff-empty
        name: behind-base-plan-does-not-write
      - type: prompt
        name: preserves-head-without-blocker
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the response preserves the head in all three stages,
            rejects rebase, merge from base, update-branch and push just because
            base advanced, and retains current-head evidence while rechecking
            actual merge gates and authorization. Score 1 if it insists on
            catching up, invalidates reviews solely due to divergence, restarts
            CI unnecessarily, or performs calls or edits.
      - type: skill-invocation
        config:
          required: [pr]

  - name: verified-base-update-blockers
    prompt: >-
      Use pr to plan two independent submitted PRs. PR A has confirmed merge
      conflicts after base advances. PR B has no conflicts, but a verified
      enforced strict up-to-date requirement blocks merging its stale head.
      Both have known review fixes ready and CI passing on the old head.
      Explain the minimum justified updates, what to record and recheck,
      how to handle another base advance, and which evidence must be renewed.
      One branch is shared and has no force-push authorization.
      No commands, edits, agents, or network calls are authorized.
    tags:
      scenario: base-update-gate
      cost: low
    rubric:
      - Resolves confirmed post-submission conflicts and satisfies the verified enforced freshness blocker rather than ignoring either.
      - Records the blocker and target base OID, rechecks necessity before updating, and batches known fixes where practical.
      - Rebases only when necessary, requires fresh evidence for repeat updates, and obtains invalidated checks and expected reviews on the new head.
      - Does not bypass required checks or force-push a shared branch without explicit confirmation.
    graders:
      - type: diff-empty
        name: required-update-plan-does-not-write
      - type: prompt
        name: minimum-necessary-base-update
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if both real blockers are remediated, with the blocker
            and target base OID recorded and necessity rechecked before updating.
            Batch known fixes where practical; require fresh evidence before
            repeating an update and invalidated checks plus expected reviews
            on the new head. Rebase only when necessary and preserve the
            shared-branch force-push approval boundary. Score 1 if it ignores
            conflicts or strict freshness, reuses stale checks or reviews after
            changing the head, blindly chases base, or bypasses safety gates.
      - type: skill-invocation
        config:
          required: [pr]

  - name: unknown-mergeability-and-queue
    prompt: >-
      Use pr to explain two independent cases. In case A the PR is behind,
      mergeability is UNKNOWN, and branch policy evidence is unavailable.
      In case B a conflict-free PR is behind and requires a merge queue with
      a verified authorized strategy; queue admission does not require a
      branch update. Explain whether either case warrants a speculative
      rebase and what evidence or gates remain necessary.
      No commands, edits, agents, or network calls are authorized.
    tags:
      scenario: base-update-gate
      cost: low
    rubric:
      - Uses bounded rechecking or reports an evidence blocker for UNKNOWN state, without speculative rebasing or claiming readiness.
      - Does not update the branch merely for queue admission and retains normal CI, review, and authorization gates.
      - Queue admission is not a merge; waits for actual merge confirmation before cleanup.
    graders:
      - type: diff-empty
        name: uncertain-update-plan-does-not-write
      - type: prompt
        name: no-speculative-base-updates
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if neither case triggers a speculative branch update.
            Case A needs bounded rechecking or a blocker report, not assumed
            merge readiness. Case B preserves the head and all normal merge
            gates; queue admission is not a merge and cleanup waits for actual
            confirmation. Score 1 for rebasing on uncertainty or queue presence,
            treating unavailable evidence as permission, or premature cleanup.
      - type: skill-invocation
        config:
          required: [pr]

  - name: terse-fix-replies-with-commit-links
    prompt: |
      Use pr to draft the replies for this complete synthetic review evidence,
      then state which threads to resolve. No commands, edits, agents, or network calls.
      Copilot inline thread T8 reports dropped saved criteria, fixed and verified in
      https://github.com/sample-owner/sample-repo/commit/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.
      Two body-only findings in Copilot review R30, headings "Timeout" and "Pagination",
      are fixed and verified in
      https://github.com/sample-owner/sample-repo/commit/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:
      requests now honor the configured timeout and results include every page.
      They have no inline threads. Human thread T9 asks whether arbitrary sort
      fields are accepted. This finding is disputed: src/query.ts:18 rejects
      fields outside the allowlist, and the unknown-field regression test passes.
      There is no fixing commit for T9; the reviewer's follow-up question is open.
      The final-head review and CI gates have not yet completed.
    tags:
      scenario: terse-review-replies
      cost: low
    rubric:
      - Replies to T8, both R30 findings, and T9 without omitting body-only feedback.
      - Uses one short sentence or bullet per fix with the supplied actual fixing commit link and a brief change description.
      - May group R30 findings but identifies each by review ID and heading and attributes each to the correct commit.
      - Gives a concise evidence-backed disposition for disputed T9 without inventing a fixing commit.
      - Resolves fixed bot T8, claims no body-only thread resolution, keeps human T9 open, and retains final-head review and CI gates.
      - Omits long validation summaries and verbose resolution reports.
    graders:
      - type: diff-empty
        name: reply-draft-does-not-write
      - type: prompt
        name: terse-complete-evidence-backed-replies
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if replies cover T8, both R30 headings, and T9.
            Require one short sentence or bullet per fix, a clickable link to
            the supplied actual fixing commit (a for T8, b for each R30 fix),
            and a brief accurate change description. Grouping R30 is allowed
            only with both fixes identifiable by review ID and heading.
            T9 must receive a concise disposition citing the allowlist and
            regression evidence, not a fabricated fix. Resolve only fixed bot
            T8, keep human T9 open, do not claim nonexistent body-only threads
            resolved, and retain pending final-head review and CI gates.
            Score 1 if it omits any finding or commit link, invents or
            misattributes a fixing commit, posts verbose validation or resolution
            reports, resolves T9, waives gates, or executes commands or writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: documentation-preflight-reuse
    prompt: >-
      Use pr to explain documentation preflight after go hands off completed
      implementation, tests, and code review. First doc-doctor has not run;
      then consider passing doc-doctor evidence for the same worktree, base,
      changeset, and scope; finally consider a later CLI behavior edit.
      Also explain what happens if doc-doctor is unavailable.
      Do not execute commands or perform repository or network writes.
    rubric:
      - pr owns doc-doctor and runs it once for the diff and affected docs when no valid evidence exists.
      - Does not ask go to run a second documentation pass.
      - Reuses matching passing documentation evidence without rerunning it.
      - The later edit invalidates affected evidence and requires a fresh check.
      - Missing doc-doctor blocks preflight with installation guidance rather than silently skipping it.
    graders:
      - type: diff-empty
        name: documentation-plan-does-not-write
      - type: prompt
        name: single-owner-documentation-check
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if pr owns the documentation pass, invokes doc-doctor
            when necessary, reuses only identity-matching passing evidence,
            reruns affected checks after edits, and blocks with installation
            guidance when doc-doctor is missing. Score 1 for duplicating the pass
            in go, reusing stale evidence, silently skipping a missing skill,
            or performing writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: default-merge-approval
    prompt: >-
      Use pr to explain the next step for a ready PR with green CI, complete
      current-head reviews, required approvals, and settled feedback. No merge
      mode was supplied, but an older standing policy allows merging on Copilot
      approval. No commands, edits, agents, or network calls are authorized.
    rubric:
      - Defaults to approval mode despite the standing policy and reviewer approval.
      - Presents PR, repository, full head OID, and strategy for final user confirmation.
      - Offers merge this head, invocation-only auto mode, or not yet; absent confirmation reports awaiting merge approval, not merged.
      - Defaults to squash merging and deleting the PR branch afterward and includes cleanup in the final prompt.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if approval is the default despite prior standing policy,
            the final prompt identifies repository, PR, full head and strategy
            (requests missing identity rather than inventing it), and offers
            confirmation, invocation-only auto, or not yet, defaulting to squash
            and post-merge branch deletion. Score 1 if reviewer
            approval substitutes for user consent, it merges, claims completion,
            persists a preference, or performs commands or writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: explicit-auto-merge
    prompt: >-
      Use pr --merge=auto to explain delivery for a ready PR, then for one with
      a pending expected current-head review. Also explain a validated go handoff
      carrying auto mode and its explicit user-authorization source.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Accepts direct and validated handoff auto mode as invocation-only merge authorization.
      - Skips only the final merge prompt when all gates pass, never other approval boundaries.
      - Waits for pending current-head review and retains all CI and feedback gates.
      - Uses literal head-pinned merge and verifies actual merged state, never GitHub --auto.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if direct and validated go auto choices avoid a redundant
            final merge prompt for a ready PR, preserve other approvals, block
            on the pending review, and require a literal full-head-pinned merge
            plus actual merged-state verification. Score 1 for GitHub --auto,
            bypassed gates, persisting preferences, or executing commands or writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: explicit-approval-overrides-standing-policy
    prompt: >-
      Use pr --merge=approval. A prior standing policy and an earlier go handoff
      allowed auto mode, but this is the user's later explicit choice. All
      readiness gates pass; final confirmation is declined or unavailable.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Honors the later explicit approval choice rather than standing policy or old handoff.
      - Pauses without merging when confirmation is declined or unavailable.
      - Reports awaiting merge approval, not merged, without changing saved preferences.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the latest explicit approval mode wins over old
            handoff and policy, and missing or declined confirmation pauses
            delivery with an honest not-merged status. Score 1 for inferring
            consent, falling back to auto, persisting preferences, or commands/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: changed-head-needs-fresh-approval
    prompt: >-
      Use pr in approval mode. The user confirmed squash merging head A, but
      a review fix was pushed as head B. All checks and reviews now pass for B.
      Separately consider changing the merge strategy after confirmation.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Invalidates confirmation after a new head or changed strategy.
      - Requests fresh confirmation identifying the actual full head and strategy.
      - Rechecks all gates after waiting and never claims the merge already occurred.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if both changed head and changed strategy invalidate
            final confirmation, require fresh identity-bound consent, and retain
            gate revalidation after waiting. Score 1 for reusing head A consent
            for B, treating green checks as consent, or commands/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: conflicting-merge-modes
    prompt: >-
      Use pr --merge=auto --merge=approval for a ready PR.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Asks the user to resolve contradictory choices before merging.
      - Does not infer auto authorization or use last-flag-wins.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if it asks for clarification and blocks merging.
            Score 1 for picking auto, last-flag-wins, inventing consent,
            or performing commands or writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: squash-and-cleanup-defaults
    prompt: >-
      Use pr --merge=auto to explain a ready PR with all gates passing and no
      strategy or cleanup override. After merge, its local branch remains
      checked out in another worktree. Separately consider an explicit user
      request to rebase merge and keep the branch, and a repository where squash
      is disabled with no strategy override. No commands, edits, agents, or
      network calls are authorized.
    rubric:
      - Defaults to squash merging and deleting the PR branch after merge.
      - Honors the explicit rebase and keep-branch choices instead of those defaults.
      - Blocks for a strategy decision when squash is unavailable rather than silently falling back.
      - Verifies actual merge and branch deletion separately and reports merged with cleanup pending for the checked-out local branch.
      - Never force-deletes branches, removes worktrees, discards changes, or deletes a default branch or advanced head.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if defaults are squash and post-merge branch deletion,
            explicit rebase/keep overrides are honored, unavailable squash
            requires a decision, and checked-out local cleanup is reported
            pending separately from confirmed merge. Preserve local worktrees,
            changes, default branches and advanced heads. Score 1 for silent
            strategy fallback, forced cleanup, false deletion claims, or calls/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: merge-queue-deferred-cleanup
    prompt: >-
      Use pr --merge=auto for a ready PR whose base requires a merge queue,
      configured for squash. All current-head CI and reviews pass. The user
      wants the default branch cleanup. GitHub CLI accepts queue admission but
      the PR is not yet merged. Also consider a queue configured for merge
      commits instead of the authorized squash. No commands, edits, agents,
      or network calls are authorized.
    rubric:
      - Omits bundled --delete-branch without treating deferred cleanup as a request to keep the branch.
      - Verifies the queue strategy matches the authorized squash strategy; blocks on mismatch rather than bypassing the queue.
      - Does not claim queue admission is a merge or delete branches before confirmed merge of the intended head.
      - Retains all CI, review, consent, and head gates and uses separate atomic expected-OID cleanup afterward.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if it omits bundled deletion, retains the cleanup intent,
            verifies queue strategy and blocks on mismatch, waits for confirmed
            merge of the intended head rather than queue admission, and uses
            separate expected-OID cleanup without weakening other gates.
            Score 1 for --delete-branch, premature cleanup, silent strategy
            changes, --admin bypasses, or commands/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: post-merge-branch-advanced
    prompt: >-
      Use pr to explain cleanup after GitHub confirms PR head A was squash
      merged as commit S. The remote PR branch was then advanced or recreated at
      B, and a local branch also points to B. Separately consider refs still at
      A and already-absent refs. A deletion guard rejects A because the current
      value is B. No commands, edits, agents, or network calls are authorized.
    rubric:
      - Uses original PR head A as expected OID, not squash commit S or new head B.
      - Uses atomic expected-OID guards for both remote and local deletion after verifying identity and worktree safety.
      - Keeps advanced or recreated branches at B and never refreshes the guard to B or retries unconditionally.
      - Deletes matching refs at A safely, treats absent refs as already cleaned, and reports blocked cleanup separately from merged state.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if original head A is the expected OID, both local and
            remote deletions use atomic guards, advanced/recreated B is retained,
            rejected guards are not refreshed or bypassed, and absent refs need
            no deletion. Preserve identity and worktree checks and report merged
            with cleanup pending when blocked. Score 1 for bundled deletion,
            check-then-unconditional-delete, using S or B as the expected OID,
            false deletion claims, or commands/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: post-merge-complete-and-partial-issues
    prompt: >-
      Use pr to plan follow-through after GitHub confirms the intended PR head
      merged. A complete paginated inventory identifies sample/app#11, whose
      acceptance criteria all pass but which remains open; sample/app#12, which
      is already auto-closed and fully complete; and sample/app#13, where this
      PR delivered only one of three requirements and the issue is still open.
      The PR also mentions sample/app#14 as background only. Explain required
      actions and verification. No commands, edits, agents, or network calls
      are authorized.
    rubric:
      - Closes fully resolved issue 11 with completed reason, merged PR link, and evidence, then verifies persisted closed state.
      - Verifies already-closed complete issue 12 without redundant writes.
      - Keeps partial issue 13 open with completed work, remaining requirements, and next steps linked to the merged PR, verifying the persisted update.
      - Leaves reference-only issue 14 unchanged and reports all verified dispositions.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the plan closes 11 as completed with PR/evidence,
            verifies 12 without redundant writes, leaves 13 open with delivered
            and remaining work plus next steps, and leaves background-only 14
            unchanged. Require read-back verification of state and comments,
            not command success or closing keywords alone. Score 1 for closing
            partial issues, ignoring still-open completed work, claiming the
            merge alone completes delivery, or any calls/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: post-merge-issue-retry-and-permission-failure
    prompt: >-
      Use pr for a synthetic already-merged PR resumed after interruption.
      The intended head's merge is verified. Issue sample/app#21 is partial
      and open; a previous attempt already posted the correct merged PR link,
      completed work, remaining work, and next steps, but the response timed
      out. Fully resolved sample/app#22 is open and closing it returns a
      permission failure. Local branch cleanup is also blocked by a checked-out
      worktree. Explain recovery and the final status. No commands, edits,
      agents, or network calls are authorized.
    rubric:
      - Reconstructs the inventory and re-reads current issue state/comments before retrying writes.
      - Reuses issue 21's persisted update without duplicating it after the timeout.
      - Reports issue 22 as merged with issue reconciliation pending with the permission blocker, not completed or re-merged.
      - Keeps cleanup safety and pending cleanup status separate from issue reconciliation.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if recovery verifies merged identity, reconstructs
            inventory, reads back 21's state/comments and reuses the existing
            update, leaves only unfinished work pending, reports 22's permission
            blocker as merged with issue reconciliation pending, and separately
            reports checked-out branch cleanup pending without unsafe deletion.
            Score 1 for duplicate comments, retrying the merge, silently skipping
            denied writes, claiming full delivery, or calls/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: post-merge-unknown-and-cross-repository-issues
    prompt: >-
      Use pr to assess a verified merge into a non-default branch. The task
      explicitly delivers work for sample/other#31, not sample/app#31, but the
      automatic closing-link list is empty. Only two of its three requirements
      have evidence and the third requires an unverified rollout. One page of
      related discussion could not be retrieved. Another partial issue was
      accidentally auto-closed by this PR; a different issue was intentionally
      closed by a maintainer for unrelated reasons. Explain safe follow-through.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Preserves sample/other#31 identity and does not infer no related issues from missing closing links or the non-default base.
      - Does not close unknown or incomplete work; records known progress, missing rollout evidence, remaining work, and the inventory gap.
      - Reopens only a proven accidental closure by this PR with remaining-work evidence; asks before disturbing unrelated intentional closure.
      - Reports reconciliation pending for incomplete discovery/evidence instead of claiming full delivery.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the plan keeps the exact cross-repository identity,
            treats missing automatic links and non-default base as insufficient
            inventory, refuses closure without rollout evidence, records verified
            progress/remaining work and the failed page, corrects only a proven
            accidental PR closure, and seeks a decision for unrelated intentional
            closure. Report merged with issue reconciliation pending until
            discovery/evidence is complete. Score 1 for wrong-repository writes,
            no-issues claims, closure on incomplete evidence, reopening unrelated
            closures automatically, full-delivery claims, or calls/writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: pre-merge-partial-closing-link
    prompt: >-
      Use pr to plan a PR whose body says Fixes sample/app#41, although the
      change delivers only one of three acceptance criteria. The proposed
      squash commit message repeats the same closing keyword. The PR is ready
      for approval but has not merged. Explain prevention and post-merge work,
      including what happens if automatic closure cannot safely be prevented.
      No commands, edits, agents, or network calls are authorized.
    rubric:
      - Inventories acceptance criteria and evidence before merging, treating issue 41 as partial.
      - Plans removal of misleading closing keywords/links in the PR and merge message while preserving neutral references and template shape.
      - Does not mutate the issue before a verified merge, and pauses merge for a decision if automatic closure cannot safely be prevented.
      - After actual merge, keeps the issue open with a verified progress/remaining-work update without weakening merge consent or review gates.
    graders:
      - type: diff-empty
      - type: prompt
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the plan identifies partial acceptance before merge,
            removes misleading closing triggers from both PR and proposed squash
            message without unauthorized history rewriting, preserves neutral
            references/template, and pauses for a decision if premature closure
            cannot safely be prevented. Issue writes wait until verified merge;
            then require open state plus persisted delivered/remaining-work
            update. Preserve existing merge approval/review gates. Score 1 for
            knowingly merging an unsafe automatic closure, premature issue
            mutation, treating Fixes as completion proof, or calls/writes.
      - type: skill-invocation
        config:
          required: [pr]
