name: pr
description: >-
  Capability eval for the pr skill. Verifies preflight checklist execution,
  private repository Copilot reviewer suppression, bot vs human comment
  resolution, embedded review-body findings, CI/rebase monitoring, and auto-merge readiness.
type: capability

defaults:
  runs: 1
  timeout: 10m
  executor: copilot-sdk

scoring:
  weights:
    prompt: 0.333334
    diff-empty: 0.333333
    skill-invocation: 0.333333
  threshold: 0.8

stimuli:
  - name: private-repo-skips-auto-copilot-review
    prompt: >-
      Use the pr skill to plan the PR workflow for uncommitted changes in a
      private repository where no human reviewer was specified and auto-merge
      was requested. Do not run repository or network writes; state the exact
      checklist steps you will execute.
    tags:
      scenario: workflow
      cost: low
    rubric:
      - Commits uncommitted changes and runs code review, doc-doctor, test-doctor, light security review, lint, and build before submitting.
      - Checks repository visibility and does not automatically add Copilot as a reviewer because the repository is private.
      - Monitors CI, rebase state, and comments, then merges or enables auto-merge once green.
    graders:
      - type: diff-empty
        name: plan-does-not-mutate-files
      - type: prompt
        name: private-repo-workflow
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the response follows the pr checklist (commit, code review,
            doc-doctor, test-doctor, light security review, lint, build, submit PR, monitor CI/rebase/comments,
            auto-merge) and explicitly states that Copilot will not be automatically added as a
            reviewer on a private repository. Score 1 if it automatically requests Copilot review
            on the private repository or skips preflight checks.
      - type: skill-invocation
        config:
          required: [pr]

  - name: clean-headline-hides-body-only-finding
    prompt: |
      Use the pr skill to assess this complete synthetic PR review evidence.
      Plan only; do not perform repository or network writes. CI is green,
      the PR is up to date, and required approvals are satisfied. The paginated
      inline-comment and thread collections are empty. The submitted Copilot
      review body on the current head is:

      <!-- ccr-overview-v2 -->
      ### Needs a closer look
      **No open issues**
      <details>
      <summary><strong>1 previously missed issue</strong></summary>
      In code that hasn't changed since last review
      <details>
      <summary>Medium: Configured timeout is ignored</summary>
      `src/client.ts:42`
      The request still uses a hard-coded 60-second timeout instead of the
      caller's configured timeout. Current code inspection confirms this.
      Thread creation was unavailable; this finding exists only in review R17.
      </details>
      </details>

      Can the workflow declare review feedback clear, and what happens next?
    tags:
      scenario: embedded-review-finding
      cost: low
    rubric:
      - Identifies the ignored configured timeout inside the nested review body.
      - Does not trust No open issues or empty inline/thread collections as an all-clear.
      - Keeps the finding blocking until fixed and verified or explicitly settled with evidence.
      - Plans a PR reply identifying review R17 and the heading without claiming a thread was resolved.
    graders:
      - type: diff-empty
        name: embedded-finding-plan-is-read-only
      - type: prompt
        name: catches-issue-hidden-by-clean-headline
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent identifies the configured-timeout defect
            in the nested review body, refuses an all-clear despite the clean
            headline and empty thread collections, plans a verified fix or
            evidence-backed settlement, and plans a PR reply citing R17 and
            the finding heading. Score 1 if it merges or enables auto-merge
            before disposition, ignores unchanged-code findings, claims a
            nonexistent thread resolved, or performs writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: deduplicate-and-revalidate-review-body-findings
    prompt: >-
      Use the pr skill to plan remediation using this complete synthetic
      evidence; do not perform writes. Copilot review R20 has a body section
      called "Resolved findings" describing missing pagination. Current-head
      inspection shows pagination is still absent and data is truncated after
      the first page. The same concern is repeated in inline thread T5, linked
      from the body. An older review R19 reports incorrect date formatting;
      current-head code and regression tests prove that date issue fixed.
      A PR conversation comment asks an unanswered human design question.
      CI passes. How many distinct code findings need work and how should
      the workflow handle each source of feedback before merging?
    tags:
      scenario: finding-reconciliation
      cost: low
    rubric:
      - Tracks one open pagination defect despite duplicate body and inline reports.
      - Does not trust the Resolved findings label over current code evidence.
      - Records the old date-formatting finding as verified fixed rather than reopening it.
      - Keeps the unanswered human design question open and withholds an all-clear.
    graders:
      - type: diff-empty
        name: finding-reconciliation-is-read-only
      - type: prompt
        name: reconciles-sources-against-current-head
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent counts one distinct open code defect
            (pagination), links its body and inline reports, rejects the stale
            resolved label using current evidence, preserves the verified
            date fix, and leaves the human design question open. Score 1 if it
            double-counts pagination, declares it resolved, reopens the proven
            date fix without cause, resolves the human question, or performs writes.
      - type: skill-invocation
        config:
          required: [pr]

  - name: bot-vs-human-comment-resolution
    prompt: >-
      Use the pr skill to explain how to handle an open PR that is behind the
      base branch, has one failing CI check, one Copilot review comment pointing
      out a bug, and one human reviewer comment asking an open design question.
      Do not perform network or repository writes.
    tags:
      scenario: remediation
      cost: low
    rubric:
      - Rebases onto the base branch and fixes the failing CI check.
      - Fixes the bug, replies to both comments, resolves the automated Copilot thread, and leaves the human reviewer's open question unresolved.
    graders:
      - type: diff-empty
        name: explanation-does-not-mutate-files
      - type: prompt
        name: comment-and-ci-remediation
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if the agent plans to rebase the behind branch, fix the failing CI check,
            address and reply to both review comments, resolve the automated Copilot review thread,
            and keep the human reviewer's open-question thread open. Score 1 if it resolves the
            human's open question or ignores the failing CI or rebase.
      - type: skill-invocation
        config:
          required: [pr]

  - name: documentation-preflight-reuse
    prompt: >-
      Use pr to explain documentation preflight after go hands off completed
      implementation, tests, and code review. First doc-doctor has not run;
      then consider passing doc-doctor evidence for the same worktree, base,
      changeset, and scope; finally consider a later CLI behavior edit.
      Also explain what happens if doc-doctor is unavailable.
      Do not execute commands or perform repository or network writes.
    rubric:
      - pr owns doc-doctor and runs it once for the diff and affected docs when no valid evidence exists.
      - Does not ask go to run a second documentation pass.
      - Reuses matching passing documentation evidence without rerunning it.
      - The later edit invalidates affected evidence and requires a fresh check.
      - Missing doc-doctor blocks preflight with installation guidance rather than silently skipping it.
    graders:
      - type: diff-empty
        name: documentation-plan-does-not-write
      - type: prompt
        name: single-owner-documentation-check
        config:
          scoring: scale_1_5
          threshold: 0.8
          prompt: >-
            Score 5 only if pr owns the documentation pass, invokes doc-doctor
            when necessary, reuses only identity-matching passing evidence,
            reruns affected checks after edits, and blocks with installation
            guidance when doc-doctor is missing. Score 1 for duplicating the pass
            in go, reusing stale evidence, silently skipping a missing skill,
            or performing writes.
      - type: skill-invocation
        config:
          required: [pr]
