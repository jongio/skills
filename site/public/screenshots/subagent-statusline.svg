<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Subagents: follow background work at a glance</title>
  <desc id="desc">Illustrative session summaries show starting or exploring, open pull requests, confirmed merges, and failures. Run /tasks to inspect individual agents; the summary is not clickable.</desc>
